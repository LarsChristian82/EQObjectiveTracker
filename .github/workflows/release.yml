name: Package and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so the packager can read all tags

      # release.sh returns 0 on an empty token, so without this a missing secret ships a
      # silent GitHub-only release that looks green. Fail loudly instead.
      - name: Verify required secrets
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::CF_API_KEY secret is not set on this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "CF_API_KEY is present (length: ${#CF_API_KEY})."

      - name: Check TOC coverage
        run: python3 docs/check_toc.py

      # Core/Changelog.lua is generated from CHANGELOG.md and rendered by the About tab.
      # Skipping the regenerate ships an in-game changelog whose newest entry is the
      # PREVIOUS version - the file still parses, so luacheck, check_toc and the locale
      # gate all pass. This is the only thing that catches it.
      - name: Check changelog is regenerated
        run: python3 docs/_gen_changelog.py --check

      # Fails on a wrapped string missing from the manifest, a translation keyed on a
      # phrase the code no longer uses, or a translation carrying more format
      # specifiers than its English key - the last of which errors at runtime, in one
      # language only, where testing in English never sees it.
      - name: Check locales
        run: python3 docs/_verify_locale.py

      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
          luacheck .

      - name: Show tag info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # actions/checkout peels an annotated tag into a lightweight local ref, so a
          # naive cat-file would report 'commit' and falsely warn alpha on every
          # release. Re-fetch the real tag objects first.
          git fetch --force --tags origin >/dev/null 2>&1 || true
          TYPE=$(git cat-file -t "$TAG" 2>/dev/null || echo "unknown")
          echo "Tag: $TAG  (object type: $TYPE)"
          if [ "$TYPE" != "tag" ]; then
            echo "::warning::'$TAG' is a lightweight tag - the packager will treat this as an ALPHA build. For a stable release use: git tag -a $TAG -m \"$TAG\""
          fi

      # Slices the newest version section out of CHANGELOG.md for the release body.
      # Anchored on '## [<digit>' rather than any '## ', so the Keep a Changelog
      # '## [Unreleased]' heading is skipped instead of being taken as the release.
      - name: Build per-release changelog
        run: awk '/^## \[[0-9]/ { if (seen) exit; seen=1 } seen' CHANGELOG.md > .release_changelog.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          # CurseForge project ID is read from '## X-Curse-Project-ID:' in the TOC,
          # NOT from .pkgmeta. Blank means GitHub release only.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
