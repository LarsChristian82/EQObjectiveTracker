name: Lint

# The release workflow lints too, but that only fires once a tag is already pushed -
# too late to be a gate. This runs the same luacheck on every push and pull request so
# a regression is caught before it can reach a release. The `branches` filter means a
# tag push does NOT match here, so a release still lints exactly once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same action and pinned container (ghcr.io/lunarmodules/luacheck:v1.2.0) as the
      # release workflow's Lint step - keep the two on the same ref. Ubuntu's `lua-check`
      # package is mpeterv's abandoned 0.23.0, which is why neither uses apt.
      # EQOT's gate is 0 warnings AND 0 errors, and luacheck exits non-zero on either,
      # so no extra threshold handling is needed here.
      - name: Luacheck
        uses: lunarmodules/luacheck@v1

  # Its own job so a TOC failure and a lint failure are distinguishable at a glance, and
  # so neither blocks the other from reporting. The release workflow runs the TOC gate
  # too, but only once a tag is already pushed - the same reason luacheck runs here.
  toc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runs before the gate: a gate that cannot fail is worse than no gate, and this
      # repo has shipped one that was wrong in both directions. The self-test builds
      # throwaway trees under a temp directory and never reads the checkout.
      - name: Prove the TOC gate still fires
        run: python3 docs/test_check_toc.py

      - name: Check TOC coverage
        run: python3 docs/check_toc.py

  # Its own job for the same reason `toc` is: a locale failure and a TOC failure are
  # different work and should not share a red X. Release-only until 2026-08-15, which
  # meant a look-alike or an orphan sat on main until a tag went up.
  # Note this job can redden main on store drift alone, because _verify_locale.py fails
  # on orphans - so a two-repo change committed in the wrong order (addon before
  # EverythingLocales) shows up here rather than at release time. That is the intent.
  locale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check locale manifest and translations
        run: python3 docs/_verify_locale.py
